name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before it builds anything.
  workflow_call:

# Actions are pinned by commit; the comment names the tag.
jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1
      # Installs the toolchain and components rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: scripts/check.sh

  # The oldest Rust the crate declares (`rust-version`); rust-toolchain.toml
  # pins a newer one for everything else.
  msrv:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1
      - run: rustup toolchain install 1.95 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo +1.95 check --workspace --all-targets --locked

  # Known vulnerabilities and unmaintained crates, licenses and sources
  # (deny.toml).
  deny:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
        with:
          command: check

  # The library as an iOS app links it: device and simulator, without the
  # binary's allocator.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: |
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo build --locked --lib -p osm-tile-compiler --no-default-features --target "$target"
          done
