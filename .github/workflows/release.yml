name: Release

# A `v*` tag builds the compiler binary for each target and attaches it to the
# GitHub release. Each archive carries LICENSE, NOTICE, README, the licenses of
# the code the OpenMapTiles port derives from, that of the embedded OSM Bright
# style, and THIRD-PARTY-LICENSES for the crates the binary includes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Fails fast on a tag that does not name the crate version.
  version:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: blacksmith-4vcpu-ubuntu-2404, target: x86_64-unknown-linux-gnu }
          - { os: blacksmith-4vcpu-ubuntu-2404-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The toolchain rust-toolchain.toml pins, plus this build's target.
      - run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      # Writes the dependencies' licenses into each archive (about.toml).
      - run: cargo install cargo-about --locked --features cli --version 0.9.3
      - name: Build the compiler
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p osm-tile-compiler
          out="osm-tile-compiler-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir "$out"
          cp target/${{ matrix.target }}/release/osm-tile-compiler* "$out/"
          rm -f "$out"/*.d
          "$out"/osm-tile-compiler --version
          cp LICENSE NOTICE README.md "$out/"
          mkdir "$out/third-party"
          cp osm-tile-compiler/src/omt/LICENSE.* "$out/third-party/"
          cp osm-tile-compiler/style/LICENSE.md "$out/third-party/LICENSE.osm-bright.md"
          cargo about generate --locked -m osm-tile-compiler/Cargo.toml about.hbs \
            -o "$out/THIRD-PARTY-LICENSES"
          tar czf "$out.tar.gz" "$out"
          sha256sum "$out.tar.gz" > "$out.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
