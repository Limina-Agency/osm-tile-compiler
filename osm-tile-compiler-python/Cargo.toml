[package]
name = "osm-tile-compiler-python"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
rust-version.workspace = true
description = "Python bindings for osm-tile-compiler: compile, extract, update, diff, apply, inspect and verify, with progress callbacks and cancellation"
readme = "README.md"
# Built into wheels with maturin (pyproject.toml); not a crate of its own.
publish = false

[lib]
# The extension module `osm_tile_compiler._native`.
name = "_native"
crate-type = ["cdylib"]
# The tests are the Python ones in tests/; a Rust test binary would have to
# link libpython.
test = false
doctest = false

[lints]
workspace = true

[dependencies]
# The library never installs an allocator; Python's is used.
osm-tile-compiler = { path = "../osm-tile-compiler", default-features = false }
# abi3: one wheel per platform for CPython 3.10 and later. maturin sets
# PYO3_BUILD_EXTENSION_MODULE, so nothing links libpython.
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
pythonize = "0.30.0"
serde = { workspace = true }
serde_json = { workspace = true }
