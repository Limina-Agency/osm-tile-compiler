[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "osm-tile-compiler"
description = "Compile OpenStreetMap extracts into OpenMapTiles basemaps (PMTiles, MBTiles), and cut, diff, patch and check the archives"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dynamic = ["version"]
keywords = ["openstreetmap", "openmaptiles", "pmtiles", "vector-tiles", "basemap"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/Limina-Agency/osm-tile-compiler"

[tool.maturin]
python-source = "python"
module-name = "osm_tile_compiler._native"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
