# XcodeGen spec for the device test app. bootstrap.sh generates
# OtcDeviceTest.xcodeproj from it; the project itself is not committed.
name: OtcDeviceTest
options:
  bundleIdPrefix: agency.limina
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  OtcDeviceTest:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Extracts bundled into the app (Monaco by default); gitignored.
      - path: DeviceData
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - framework: ../../target/ios/OsmTileCompilerFFI.xcframework
        embed: false
      - package: MapLibre
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        PRODUCT_NAME: OtcDeviceTest
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: ["-lc++"]
        ENABLE_BITCODE: NO
        CODE_SIGN_ENTITLEMENTS: ${ENTITLEMENTS}
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Tile compiler
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Documents shows in Finder and the Files app, to copy extracts in
        # and runs.jsonl out.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
