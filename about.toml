# Licenses `cargo about generate about.hbs` accepts for the release binaries'
# dependencies (see RELEASING.md). Choose the first accepted license of an
# `OR` expression, so keep the permissive ones first.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    "WTFPL",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-dev-dependencies = true
