# git-cliff configuration: drafts the CHANGELOG.md section for a release from
# the commits since the previous tag. Pull requests do not edit CHANGELOG.md;
# see RELEASING.md for how a release uses this.
#
#   git cliff --unreleased --tag v<version> --prepend CHANGELOG.md

[changelog]
# CHANGELOG.md keeps its own "# Changelog" title; --prepend inserts below it.
header = ""
body = """
{% if version -%}
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{% endfor %}
{% endfor -%}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Plain subjects ("Compress the spilled sort runs with zstd") are kept and
# fall under "Changes"; new commits should use the conventional prefixes
# listed in CONTRIBUTING.md.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
  { message = "^Merge (pull request|branch)", skip = true },
  { message = "^Release \\d", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "(?i)^changelog[:(]", skip = true },
  { message = "(?i)^feat", group = "<!-- 0 -->Features" },
  { message = "(?i)^fix", group = "<!-- 1 -->Fixes" },
  { message = "(?i)^perf", group = "<!-- 2 -->Performance" },
  { message = "(?i)^docs", group = "<!-- 3 -->Documentation" },
  { message = "(?i)^(chore|build)", group = "<!-- 4 -->Dependencies and build" },
  { message = "(?i)^(ci|test|refactor|style)", skip = true },
  { message = ".*", group = "<!-- 5 -->Changes" },
]
