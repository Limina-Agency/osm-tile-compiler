# `cargo deny check`, run by CI: known vulnerabilities and unmaintained
# crates, licenses (the same list as about.toml), and where crates come from.

[graph]
# Only what the library and binary ship: dev-dependencies (bincode, which a
# test compares the store's keys against, and the test helpers) are left out.
exclude-dev = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
]

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# osm-tile-compiler-ffi (publish = false) uses the library by path alone.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Until osm-pbf-ingest releases the changes module (Cargo.toml's patch).
allow-git = ["https://github.com/Limina-Agency/osm-pbf-ingest"]
